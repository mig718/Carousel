version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: carousel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carousel_roles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carousel-network

volumes:
  postgres_data:

networks:
  carousel-network:
    driver: bridge
