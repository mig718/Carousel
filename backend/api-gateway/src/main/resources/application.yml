spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carousel_roles}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:8000"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: approval-service
          uri: lb://approval-service
          predicates:
            - Path=/api/approvals/**
        - id: role-service
          uri: lb://role-service
          predicates:
            - Path=/api/roles,/api/roles/**
        - id: styles-service
          uri: lb://styles-service
          predicates:
            - Path=/api/inventory/styles,/api/inventory/styles/**
        - id: styles-service-docs
          uri: lb://styles-service
          predicates:
            - Path=/api/styles/v3/api-docs
          filters:
            - RewritePath=/api/styles/v3/api-docs, /api/inventory/v3/api-docs
        - id: flow-service
          uri: lb://flow-service
          predicates:
            - Path=/api/flows,/api/flows/**
        - id: flow-service-docs
          uri: lb://flow-service
          predicates:
            - Path=/api/flow/v3/api-docs
          filters:
            - RewritePath=/api/flow/v3/api-docs, /api/flows/v3/api-docs
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

server:
  port: 8000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: User Service
        url: /api/users/v3/api-docs
      - name: Approval Service
        url: /api/approvals/v3/api-docs
      - name: Role Service
        url: /api/roles/v3/api-docs
      - name: Style Service
        url: /api/styles/v3/api-docs
      - name: Flow Service
        url: /api/flow/v3/api-docs
      - name: Inventory Service
        url: /api/inventory/v3/api-docs
    urlsPrimaryName: Auth Service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}

carousel:
  clients:
    user-service-url: ${CAROUSEL_CLIENTS_USER_SERVICE_URL:http://localhost:8002/api/users}
